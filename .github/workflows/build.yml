name: Build PDF

on:
  # 每天 UTC 16:00（北京时间 00:00）用最新代码编译一次
  schedule:
    - cron: '0 16 * * *'
  # 支持在 Actions 页面手动触发
  workflow_dispatch:
  # 打 tag（如 v1.0）时也编译一份，附到对应的 release
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 上传 release 资源需要写权限，缺了会 403

concurrency:
  group: pdf-build
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pygments
        run: pip install Pygments

      - name: Build PDF
        working-directory: src
        run: |
          # main.tex 里若有生效的 \includeonly 只会编译部分章节，先删掉这一行
          sed '/includeonly/d' main.tex > ProgrammingRust.tex
          tectonic -Z shell-escape ProgrammingRust.tex
          ls -lh ProgrammingRust.pdf

      - name: Upload PDF to release
        uses: softprops/action-gh-release@v2
        with:
          # 打 tag 时归到该 tag，其余情况统一更新 Nightly Build
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.99' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Nightly Build' }}
          body: |
            由 GitHub Actions 自动编译的最新 PDF，每次构建覆盖更新。

            直接下载：${{ github.server_url }}/${{ github.repository }}/releases/latest/download/ProgrammingRust.pdf
          files: src/ProgrammingRust.pdf
          fail_on_unmatched_files: true
          make_latest: true
